name: Build NDK Native Libraries (Multi-Arch)

on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'CMakeLists.txt'
      - '.github/workflows/build-ndk.yml'
  pull_request:
    branches: [ main, master, dev ]
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'CMakeLists.txt'
      - '.github/workflows/build-ndk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ndk-matrix:
    name: Native CMake Build (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ninja
        run: |
          if ! command -v ninja &> /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build
          fi
          ninja --version

      - name: Locate or Install Android NDK
        id: setup-ndk
        run: |
          echo "Scanning for Android NDK..."
          NDK_PATH=""
          if [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            # Search for preferred version 27.2.12479018 first, or pick newest
            if [ -d "$ANDROID_SDK_ROOT/ndk/27.2.12479018" ]; then
              NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
            else
              NDK_PATH=$(find "$ANDROID_SDK_ROOT/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
            fi
          fi

          if [ -z "$NDK_PATH" ] && [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            NDK_PATH="$ANDROID_NDK_ROOT"
          fi

          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "Installing NDK 27.2.12479018 via sdkmanager..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
            NDK_PATH="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi

          echo "Using Android NDK located at: $NDK_PATH"
          echo "path=$NDK_PATH" >> $GITHUB_OUTPUT
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Configure CMake (${{ matrix.abi }})
        run: |
          cmake -B build-${{ matrix.abi }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=OFF \
            -DGGML_LLAMAFILE=OFF \
            app/src/main/cpp

      - name: Build llama_jni Shared Library (${{ matrix.abi }})
        run: |
          cmake --build build-${{ matrix.abi }} --target llama_jni -j$(nproc)

      - name: Validate Binary Artifacts & Symbols (${{ matrix.abi }})
        run: |
          echo "=== Built Libraries for ${{ matrix.abi }} ==="
          find build-${{ matrix.abi }} -name "*.so" -ls

          SO_PATH=$(find build-${{ matrix.abi }} -name "libllama_jni.so" | head -n 1)
          if [ -z "$SO_PATH" ] || [ ! -f "$SO_PATH" ]; then
            echo "::error::libllama_jni.so not found for ABI ${{ matrix.abi }}"
            exit 1
          fi

          echo "=== File details ==="
          file "$SO_PATH"

          echo "=== Checking Exported JNI Symbols ==="
          readelf -Ws --dyn-syms "$SO_PATH" | grep -E "Java_com_aidetector" || true

          # Mandatory JNI entrypoints validation
          REQUIRED_SYMBOLS=(
            "Java_com_aidetector_llm_LlamaRunner_nativeLoad"
            "Java_com_aidetector_llm_LlamaRunner_nativeGenerate"
            "Java_com_aidetector_llm_LlamaRunner_nativeFree"
            "Java_com_aidetector_llm_LlamaRunner_nativeModelInfo"
          )

          for sym in "${REQUIRED_SYMBOLS[@]}"; do
            if ! readelf -Ws --dyn-syms "$SO_PATH" | grep -q "$sym"; then
              echo "::error::Missing critical JNI entrypoint: $sym"
              exit 1
            fi
            echo " [OK] Verified symbol: $sym"
          done

      - name: Upload Native Artifacts (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: llama_jni-${{ matrix.abi }}
          path: |
            build-${{ matrix.abi }}/**/*.so
          if-no-files-found: error
          retention-days: 14

  gradle-build-validation:
    name: Gradle APK Build Validation
    runs-on: ubuntu-latest
    needs: build-ndk-matrix
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK (arm64-v8a)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-hardware-detector-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
